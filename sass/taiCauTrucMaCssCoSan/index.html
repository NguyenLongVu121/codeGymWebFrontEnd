<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Grid</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="gridcontainer-wrapper">
      <div class="gridcontainer">
        <div class="gridwrapper header-wrapper">
          <div class="gridcontent header-content"></div>
        </div>

        <div class="gridwrapper main-wrapper">
          <div class="gridcontent sidebar">
            <div class="sub-block"></div>
            <div class="sub-block"></div>
            <div class="sub-block"></div>
            <div class="sub-block"></div>
          </div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent sidebar-right">
            <div class="sub-block-tall"></div>
          </div>
        </div>

        <div class="gridwrapper footer-wrapper">
          <div class="gridcontent footer-content"></div>
        </div>
      </div>

      <div class="gridcontainer transparent-grid">
        <div class="gridwrapper">
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
          <div class="gridcontent"></div>
        </div>
      </div>
    </div>

    <p>
      Resize the browser window to see that this grid will respond to the
      resizing, and always use 100% of the available space.
    </p>
  </body>
</html>
