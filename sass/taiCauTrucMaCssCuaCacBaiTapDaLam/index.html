<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page - SASS Restructure</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Header & Navigation -->
    <header class="header">
      <div class="container">
        <div class="logo">MyBrand</div>
        <nav class="nav">
          <a href="#">Trang chủ</a>
          <a href="#">Sản phẩm</a>
          <a href="#">Thống kê</a>
          <a href="#">Liên hệ</a>
        </nav>
        <button class="btn btn-primary">Đăng nhập</button>
      </div>
    </header>

    <!-- Featured Products -->
    <section class="products">
      <div class="container">
        <h2>Sản phẩm nổi bật</h2>
        <div class="product-grid">
          <div class="product-card">
            <div class="product-img"></div>
            <h3>Sản phẩm 1</h3>
            <p>Mô tả ngắn gọn về sản phẩm 1.</p>
            <button class="btn btn-secondary">Mua ngay</button>
          </div>
          <div class="product-card">
            <div class="product-img"></div>
            <h3>Sản phẩm 2</h3>
            <p>Mô tả ngắn gọn về sản phẩm 2.</p>
            <button class="btn btn-secondary">Mua ngay</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Statistics -->
    <section class="stats">
      <div class="container">
        <div class="stat-item">
          <h3>10,000+</h3>
          <p>Khách hàng</p>
        </div>
        <div class="stat-item">
          <h3>500+</h3>
          <p>Dự án</p>
        </div>
        <div class="stat-item">
          <h3>99%</h3>
          <p>Hài lòng</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 CodeGym. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
