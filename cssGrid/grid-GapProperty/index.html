<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS grid-gap Property</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>1. Ví dụ 1: Truyền 1 giá trị (Hàng và cột có khoảng cách bằng nhau)</h2>
    <div class="grid-container grid-1">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
    </div>

    <h2>2. Ví dụ 2: Truyền 2 giá trị (`grid-row-gap` `grid-column-gap`)</h2>
    <div class="grid-container grid-2">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
    </div>
  </body>
</html>
