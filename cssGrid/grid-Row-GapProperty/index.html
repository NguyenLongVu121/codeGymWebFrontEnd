<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS grid-row-gap</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>1. Dùng `grid-row-gap` đơn vị `px` (Khoảng cách giữa các hàng 30px)</h2>
    <div class="grid-container grid-px">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
    </div>

    <h2>2. Dùng `grid-row-gap` đơn vị `%` (Khoảng cách hàng theo phần trăm)</h2>
    <div class="grid-container grid-percent">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
    </div>
  </body>
</html>
