<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <title>Bố cục Responsive bằng CSS Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- 1. Header -->
      <header class="header">Header - Tiêu đề trang</header>

      <nav class="nav">

        <a href="#">Tin tức</a>
        <a href="#">Sản phẩm</a>
