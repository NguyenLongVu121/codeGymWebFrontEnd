<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS grid-row</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>
      1. Dùng `grid-row: start / end` (Chỉ định đường kẻ bắt đầu / kết thúc)
    </h2>
    <div class="grid-container">
      <div class="item item-row-1-3">Item 1 (Spans row-line 1 to 3)</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
    </div>

    <h2>2. Dùng `grid-row: start / span n` (Bắt đầu và kéo dài qua n hàng)</h2>
    <div class="grid-container">
      <div class="item item-span-2">Item 1 (Span 2 rows)</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
    </div>
  </body>
</html>
