<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS grid-template-columns</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Ví dụ 1: Chia cột cố định bằng `px` và `auto`</h2>
    <div class="grid-container grid-1">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
    </div>

    <h2>Ví dụ 2: Chia cột tỉ lệ bằng đơn vị `fr` (Fractional Unit)</h2>
    <div class="grid-container grid-2">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
    </div>
  </body>
</html>
