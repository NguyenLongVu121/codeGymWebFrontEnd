<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Bố Cục 3 Cột bằng Bootstrap Grid và Flexbox</title>

    <!-- Nhúng Bootstrap 5 CSS via CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <!-- Bước 2: Áp dụng Margin & Padding để điều chỉnh khoảng cách -->
    <section class="container my-5 py-3 border-bottom">
      <h3 class="text-center">
        Khoảng cách được điều chỉnh bằng Margin & Padding
      </h3>
    </section>

    <!-- Bước 1: Cấu trúc Grid với 3 cột kết hợp Flexbox -->
    <section class="container mt-5">
      <div class="row g-3">
        <!-- Cột 1 -->
        <div
          class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border rounded"
        >
          <p class="mb-0 fw-bold text-dark">Phần 1</p>
        </div>

        <!-- Cột 2 -->
        <div
          class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white rounded"
        >
          <p class="mb-0 fw-bold">Phần 2</p>
        </div>

        <!-- Cột 3 -->
        <div
          class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border rounded"
        >
          <p class="mb-0 fw-bold text-dark">Phần 3</p>
        </div>
      </div>
    </section>

    <!-- Bước 3: Sử dụng Display Property để ẩn/hiện nội dung theo kích thước màn hình -->
    <section class="container mt-4">
      <div class="d-none d-md-block bg-warning text-center p-3 rounded">
        <p class="mb-0 fw-bold">
          Nội dung này chỉ hiển thị trên màn hình lớn hơn 768px (Desktop /
          Tablet lớn)
        </p>
      </div>
    </section>
  </body>
</html>
