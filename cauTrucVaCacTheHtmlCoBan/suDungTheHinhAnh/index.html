<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Sử dụng thẻ hình ảnh</title>
  </head>
  <body>
    <h1>Trang web hiển thị hình ảnh</h1>

    <!-- 1. Sử dụng ảnh trong cùng thư mục (đã lưu sẵn trên máy) -->
    <p>Ảnh lưu trên máy tính:</p>
    <img
      src="https://png.pngtree.com/thumb_back/fh260/background/20210912/pngtree-fresh-and-beautiful-blue-sky-and-white-clouds-photography-map-image_873375.jpg"
      alt="Hình ảnh yêu thích của tôi"
      width="400"
    />

    <hr />

    <!-- 2. Hoặc sử dụng link ảnh online trực tiếp từ đường dẫn mạng -->
    <p>Ảnh lấy trực tiếp từ đường dẫn mạng:</p>
    <img
      src="https://png.pngtree.com/thumb_back/fh260/background/20210912/pngtree-fresh-and-beautiful-blue-sky-and-white-clouds-photography-map-image_873375.jpg"
      alt="Hình ảnh nói về bầu trời"
      width="400"
    />
  </body>
</html>
