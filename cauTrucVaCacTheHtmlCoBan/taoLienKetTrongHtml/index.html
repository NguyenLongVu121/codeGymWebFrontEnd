<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Tạo liên kết trong HTML</title>
  </head>
  <body>
    <!-- 1. Tiêu đề h1 -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- 2. Danh sách không có thứ tự chứa ít nhất 3 liên kết -->
    <ul>
      <!-- 3. Liên kết mở trong tab mới với target="_blank" -->
      <li>
        <a href="https://www.google.com" target="_blank">Google (Mở tab mới)</a>
      </li>
      <li>
        <a href="https://www.youtube.com" target="_blank"
          >YouTube (Mở tab mới)</a
        >
      </li>
      <li>
        <a href="https://codegym.vn" target="_blank">CodeGym (Mở tab mới)</a>
      </li>

      <!-- 4. Liên kết đến file HTML khác trong cùng thư mục (about.html) -->
      <li>
        <a href="about.html">Trang Giới thiệu (about.html)</a>
      </li>

      <!-- 5. Liên kết gửi email với mailto: -->
      <li>
        <a href="mailto:example@gmail.com">Gửi email cho tôi</a>
      </li>
    </ul>
  </body>
</html>
