<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Sử dụng các thẻ tiêu đề và đoạn văn</title>
  </head>
  <body>
    <!-- Tiêu đề chính -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Tiêu đề phụ -->
    <h2>Giới thiệu bản thân</h2>

    <!-- Đoạn văn mô tả sở thích cá nhân -->
    <p>
      Tôi thích đọc sách, nghe nhạc và tìm hiểu về các công nghệ lập trình mới
      mỗi khi có thời gian rảnh.
    </p>

    <!-- Đoạn văn mô tả mục tiêu học lập trình -->
    <p>
      Mục tiêu của tôi là nắm vững kiến thức HTML/CSS và JavaScript để trở thành
      một lập trình viên Front-End giỏi trong tương lai.
    </p>
  </body>
</html>
