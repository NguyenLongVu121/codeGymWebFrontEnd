<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Định dạng văn bản với HTML Styles</title>
  </head>
  <body>
    <!-- 1. Tiêu đề <h1> màu xanh dương -->
    <h1 style="color: blue">Bài viết của tôi</h1>

    <!-- 2. Đoạn văn màu đỏ và in đậm <b> -->
    <p style="color: red">
      <b>Đây là đoạn văn được định dạng màu sắc.</b>
    </p>

    <!-- 3. Đoạn văn in nghiêng <i> và căn giữa -->
    <p style="text-align: center">
      <i>Tôi đang học HTML Styles.</i>
    </p>

    <!-- 4. Đoạn văn cỡ chữ 20px và gạch chân <u> -->
    <p style="font-size: 20px">
      <u>Định dạng văn bản giúp trang web đẹp hơn.</u>
    </p>
  </body>
</html>
