<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Navbar</title>

    <!-- Nhúng Bootstrap CSS từ CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <!-- Khai báo thanh Navbar của Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <!-- Thương hiệu / Logo trang web -->
        <a class="navbar-brand" href="#">MyWebsite</a>

        <!-- Nút Toggler hiển thị trên giao diện Mobile (Menu Hamburger) -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Khung danh sách các menu điều hướng -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <!-- Mục Home (Trang chủ) đang được kích hoạt (active) -->
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>

            <!-- Mục About -->
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>

            <!-- Mục Dropdown (Danh mục sổ xuống) -->
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="navbarDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Services
              </a>
              <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                <li><a class="dropdown-item" href="#">Web Design</a></li>
                <li><a class="dropdown-item" href="#">SEO</a></li>
              </ul>
            </li>

            <!-- Mục Contact -->
            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Nhúng Bootstrap JavaScript từ CDN (Cần thiết để chạy các tính năng tương tác như Dropdown và Toggler mobile) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
