<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS flex-grow Property</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>
      Ví dụ: 5 thẻ div trong vùng chứa (Thẻ thứ 2 được đặt `flex-grow: 3`)
    </h2>
    <div class="flex-container">
      <div class="item item-1">Div 1 (grow: 1)</div>
      <div class="item item-2">Div 2 (grow: 3)</div>
      <div class="item item-3">Div 3 (grow: 1)</div>
      <div class="item item-4">Div 4 (grow: 1)</div>
      <div class="item item-5">Div 5 (grow: 1)</div>
    </div>
  </body>
</html>
