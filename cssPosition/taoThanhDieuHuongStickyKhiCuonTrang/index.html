<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Navigation</title>
    <!-- Nhúng file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Thanh điều hướng dính (Sticky Menu) -->
    <nav class="sticky-menu">
      <ul>
        <li><a href="#home">Trang chủ</a></li>
        <li><a href="#about">Giới thiệu</a></li>
        <li><a href="#services">Dịch vụ</a></li>
        <li><a href="#contact">Liên hệ</a></li>
      </ul>
    </nav>

    <!-- Các phần nội dung trang web để tạo độ dài cuộn trang -->
    <section id="home">
      <h1>Chào mừng đến với trang web của chúng tôi</h1>
      <p>Hãy cuộn xuống để xem hiệu ứng sticky.</p>
    </section>

    <section id="about">
      <h2>Giới thiệu</h2>
      <p>Nội dung giới thiệu rất dài...</p>
    </section>

    <section id="services">
      <h2>Dịch vụ</h2>
      <p>Danh sách các dịch vụ...</p>
    </section>

    <section id="contact">
      <h2>Liên hệ</h2>
      <p>Thông tin liên hệ...</p>
    </section>
  </body>
</html>
