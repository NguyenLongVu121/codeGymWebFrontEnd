<!doctype html>
<html>
  <head>
    <style>
      /* Khối bao ngoài */
      #demo {
        width: 350px;
        display: flex; /* Sử dụng Flexbox để xếp 2 khối con nằm ngang */
        float: left;
        border: 6px solid black;
        border-radius: 6%;
      }

      /* Khối con thứ nhất (.d1) */
      .d1 {
        margin-left: 20px;
        width: 150px;
        height: 80px;
        box-shadow: 0 0 0 4px mediumslateblue;
        box-sizing: border-box; /* Khóa kích thước cố định */
        border-radius: 36%;
      }

      /* Khối con thứ hai (.d2) */
      .d2 {
        width: 150px;
        height: 80px;
        padding: 30px; /* Khoảng đệm bên trong */
        box-shadow: 0 0 0 4px darkred;
        box-sizing: border-box; /* Giúp padding không làm tăng tổng chiều rộng */
        border-radius: 36%;
      }
    </style>
  </head>
  <body>
    <!-- Khối cha chứa id="demo" -->
    <div id="demo">
      <div class="d1"></div>
      <div class="d2"></div>
    </div>
  </body>
</html>
