<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo trang web với màu nền và ảnh nền</title>
    <!-- Nhúng file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Tiêu đề h1 theo yêu cầu -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn p mô tả trang web -->
    <p>
      Trang web này được sử dụng để luyện tập thuộc tính màu nền
      (background-color) và ảnh nền (background-image) trong CSS.
    </p>

    <!-- Khối div chứa nội dung quan trọng -->
    <div class="important-box">
      <h2>Thông Tin Quan Trọng</h2>
      <p>
        Đây là khối nội dung quan trọng được trang trí ảnh nền riêng và căn giữa
        văn bản hoàn chỉnh.
      </p>
    </div>
  </body>
</html>
