<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sử dụng bộ chọn CSS</title>
    <!-- Nhúng file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Tiêu đề h1 sử dụng Element Selector hoặc ID Selector -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Đoạn văn mô tả bản thân sử dụng Class Selector -->
    <p class="description">
      Xin chào! Tôi là một học viên lập trình đang thực hành sử dụng các loại bộ
      chọn CSS khác nhau để làm đẹp cho trang web.
    </p>

    <!-- Danh sách 3 sở thích -->
    <ul class="hobby-list">
      <li class="hobby-item item-1">Lập trình web</li>
      <li class="hobby-item item-2">Đọc sách công nghệ</li>
      <li class="hobby-item item-3">Chơi thể thao</li>
    </ul>

    <!-- Nút bấm sử dụng Pseudo-class :hover -->
    <button class="btn-submit">Nhấn vào đây</button>
  </body>
</html>
