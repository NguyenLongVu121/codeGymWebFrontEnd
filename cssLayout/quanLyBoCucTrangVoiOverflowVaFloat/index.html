<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bố cục với Float và Overflow</title>
    <!-- Nhúng file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Bố cục trang với float và overflow</h1>

    <!-- Khối 1: Bố cục chia 2 cột dùng float -->
    <div class="container">
      <div class="left-column">Nội dung bên trái</div>
      <div class="right-column">Nội dung bên phải</div>
    </div>

    <!-- Khối 2: Quản lý chữ tràn với overflow -->
    <div class="overflow-box">
      Đây là nội dung rất dài mà chúng ta kiểm tra overflow. Lorem ipsum dolor
      sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut
      labore et dolore magna aliqua.
    </div>
  </body>
</html>
