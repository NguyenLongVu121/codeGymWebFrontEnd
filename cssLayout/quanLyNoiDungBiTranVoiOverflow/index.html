<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Overflow</title>
    <!-- Nhúng file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Khối div giới hạn kích thước chứa văn bản dài -->
    <div class="overflow-box">
      Đây là một đoạn văn bản rất dài mà chúng ta sẽ kiểm tra cách `overflow`
      hoạt động. Khi văn bản vượt quá chiều cao và chiều rộng của khung chứa,
      thuộc tính CSS này sẽ quyết định xem phần nội dung thừa ra sẽ bị ẩn đi,
      kéo dài khung ra hay xuất hiện thanh cuộn để người dùng có thể thao tác.
    </div>
  </body>
</html>
