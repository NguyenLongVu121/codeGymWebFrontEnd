<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo bố cục cơ bản</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main">
      <!-- Phần Banner / Header -->
      <div id="head">
        <h1>LOGO & BANNER</h1>
      </div>

      <!-- Phần Menu Điều Hướng -->
      <div id="head-link">
        <a href="#">Home</a>
        <a href="#">Students</a>
        <a href="#">Course</a>
      </div>

      <!-- Phần Nội Dung Bên Trái -->
      <div id="left">
        <h3>Menu Trái</h3>
        <ul>
          <li>Liên kết 1</li>
          <li>Liên kết 2</li>
          <li>Liên kết 3</li>
        </ul>
      </div>

      <!-- Phần Nội Dung Chính Giữa -->
      <div id="content">
        <h2>Nội Dung Chính</h2>
        <p>
          Đây là khu vực hiển thị các bài viết, tin tức nổi bật, tin tức chính
          của trang web.
        </p>
      </div>

      <!-- Phần Nội Dung Bên Phải -->
      <div id="right">
        <h3>Cột Phải</h3>
        <p>Lịch biểu, thông báo phụ hoặc quảng cáo.</p>
      </div>

      <!-- Xóa float để footer không bị tràn đè lên các cột -->
      <div style="clear: both"></div>

      <!-- Phần Chân Trang -->
      <div id="footer">
        <p>&copy; 2026 Bản quyền thuộc về CodeGym</p>
      </div>
    </div>
  </body>
</html>
