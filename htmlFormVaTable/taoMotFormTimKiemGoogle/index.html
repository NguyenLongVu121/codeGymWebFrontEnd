<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Form Tìm kiếm Google</title>
  </head>
  <body>
    <h2>Tìm kiếm trên Google</h2>

    <!-- Form tìm kiếm gửi dữ liệu đến Google Search -->
    <form action="https://www.google.com.vn/search" method="GET">
      <input type="text" name="q" placeholder="Nhập từ khóa" />
      <input type="submit" value="Tìm kiếm" />
    </form>
  </body>
</html>
