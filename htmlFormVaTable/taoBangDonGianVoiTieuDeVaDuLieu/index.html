<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Bảng đơn giản trong HTML</title>
  </head>
  <body>
    <h2>Danh sách học sinh</h2>

    <!-- Tạo bảng có đường viền hiển thị (border="1") -->
    <table border="1">
      <!-- Hàng 1: Tiêu đề các cột -->
      <tr>
        <th>Họ và Tên</th>
        <th>Tuổi</th>
        <th>Lớp</th>
      </tr>

      <!-- Hàng 2: Dữ liệu học sinh 1 -->
      <tr>
        <td>Nguyễn Văn A</td>
        <td>15</td>
        <td>10A1</td>
      </tr>

      <!-- Hàng 3: Dữ liệu học sinh 2 -->
      <tr>
        <td>Trần Thị B</td>
        <td>16</td>
        <td>11B2</td>
      </tr>

      <!-- Hàng 4: Dữ liệu học sinh 3 -->
      <tr>
        <td>Lê Văn C</td>
        <td>17</td>
        <td>12C3</td>
      </tr>
    </table>
  </body>
</html>
