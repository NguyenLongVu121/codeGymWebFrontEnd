<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Bài tập Tạo form đơn giản</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f4f4f4;
      }
      .form-container {
        background-color: #ffffff;
        padding: 20px;
        margin-bottom: 30px;
        border-radius: 8px;
        max-width: 500px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"],
      select {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .checkbox-group {
        display: flex;
        gap: 15px;
      }
      .btn-submit {
        background-color: #4caf50;
        color: white;
        padding: 8px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-reset {
        background-color: #f44336;
        color: white;
        padding: 8px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- PHẦN 1: Form thông tin cá nhân & Sở thích -->
    <div class="form-container">
      <h2>Phần 1: Form thông tin cá nhân</h2>
      <form action="#" method="POST">
        <!-- TextBox Họ và tên (yourname) -->
        <div class="form-group">
          <label for="yourname">Họ và tên:</label>
          <input
            type="text"
            id="yourname"
            name="yourname"
            placeholder="Nhập họ và tên"
          />
        </div>

        <!-- TextBox Email (email) -->
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Nhập địa chỉ email"
          />
        </div>

        <!-- CheckBox sở thích (hobby) -->
        <div class="form-group">
          <label>Sở thích:</label>
          <div class="checkbox-group">
            <label
              ><input type="checkbox" name="hobby" value="sports" /> Thể
              thao</label
            >
            <label
              ><input type="checkbox" name="hobby" value="music" /> Âm
              nhạc</label
            >
            <label
              ><input type="checkbox" name="hobby" value="reading" /> Đọc
              sách</label
            >
          </div>
        </div>

        <!-- Nút Gửi thông tin (Submit) và Nhập lại (Reset) -->
        <div class="form-group">
          <input type="submit" class="btn-submit" value="Gửi thông tin" />
          <input type="reset" class="btn-reset" value="Nhập lại" />
        </div>
      </form>
    </div>

    <!-- PHẦN 2: Form đăng ký học viên -->
    <div class="form-container">
      <h2>Phần 2: Form đăng ký học viên</h2>
      <form action="#" method="POST">
        <!-- Full Name -->
        <div class="form-group">
          <label for="fullname">Full Name:</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter full name"
            required
          />
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="student_email">Email Address:</label>
          <input
            type="email"
            id="student_email"
            name="student_email"
            placeholder="Enter email"
            required
          />
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label for="phone">Phone Number:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
          />
        </div>

        <!-- Select Course -->
        <div class="form-group">
          <label for="course">Select Course:</label>
          <select id="course" name="course">
            <option value="html_css">HTML & CSS Fundamentals</option>
            <option value="javascript">JavaScript Advanced</option>
            <option value="python">Python Programming</option>
          </select>
        </div>

        <!-- Submit & Reset Buttons -->
        <div class="form-group">
          <input type="submit" class="btn-submit" value="Register Now" />
          <input type="reset" class="btn-reset" value="Reset" />
        </div>
      </form>
    </div>
  </body>
</html>
