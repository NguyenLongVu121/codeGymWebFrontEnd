<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Đăng ký người dùng</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        padding: 20px;
      }
      .form-container {
        background-color: #ffffff;
        width: 400px;
        margin: 0 auto;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .gender-group {
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .btn-submit {
        width: 100%;
        background-color: #007bff;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }
      .btn-submit:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>Đăng Ký Người Dùng</h2>

      <!-- Form gửi dữ liệu POST đến URL theo đúng yêu cầu -->
      <form
        action="http://demo.codegym.vn/6/registration_form/register.php"
        method="POST"
      >
        <!-- Trường Họ và tên: name="name" -->
        <div class="form-group">
          <label for="name">Họ và tên:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Nhập họ và tên"
            required
          />
        </div>

        <!-- Trường Email: name="email" -->
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Nhập địa chỉ email"
            required
          />
        </div>

        <!-- Trường Số điện thoại: name="phone" -->
        <div class="form-group">
          <label for="phone">Số điện thoại:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Nhập số điện thoại"
            required
          />
        </div>

        <!-- Trường Giới tính: name="gender" -->
        <div class="form-group">
          <label>Giới tính:</label>
          <div class="gender-group">
            <label
              ><input type="radio" name="gender" value="male" checked />
              Nam</label
            >
            <label
              ><input type="radio" name="gender" value="female" /> Nữ</label
            >
            <label
              ><input type="radio" name="gender" value="other" /> Khác</label
            >
          </div>
        </div>

        <!-- Nút gửi đăng ký -->
        <div class="form-group">
          <input type="submit" class="btn-submit" value="Đăng ký" />
        </div>
      </form>
    </div>
  </body>
</html>
