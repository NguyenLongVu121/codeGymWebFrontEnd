<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Danh sách sản phẩm</title>
  </head>
  <body>
    <!-- Tiêu đề <h1> đúng yêu cầu đề bài -->

    <!-- Bảng hiển thị danh sách sản phẩm -->

      <tr>
        <th>Tên sản phẩm</th>
        <th>Giá</th>
        <th>Số lượng</th>
      </tr>

      <!-- Sản phẩm 1 -->
      <tr>
        <td>iPhone 15 Pro Max</td>
        <td>29.990.000 VNĐ</td>
        <td>15</td>
      </tr>

      <!-- Sản phẩm 2 -->
      <tr>
        <td>Samsung Galaxy S24 Ultra</td>
        <td>27.990.000 VNĐ</td>
        <td>20</td>
      </tr>

      <!-- Sản phẩm 3 -->
      <tr>
        <td>MacBook Pro M3</td>
        <td>39.990.000 VNĐ</td>
        <td>10</td>
      </tr>

      <!-- Sản phẩm 4 -->
      <tr>
        <td>Tai nghe AirPods Pro 2</td>
        <td>5.990.000 VNĐ</td>
        <td>35</td>
      </tr>
    </table>
  </body>
</html>
